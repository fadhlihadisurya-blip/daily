<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8"/>

  <g filter="url(#shadow)">
    <!-- Crescent Moon -->
    <path d="M 280 130 C 200 130 140 190 140 270 C 140 350 200 410 280 410 C 330 410 375 385 400 345 C 340 370 270 345 245 285 C 225 235 240 175 290 145 C 286 140 283 135 280 130 Z" fill="url(#gold)"/>

    <!-- Star -->
    <polygon points="340,150 348,172 370,172 352,185 358,206 340,193 322,206 328,185 310,172 332,172" fill="#ffffff"/>

    <!-- Checkmark (Mutaba'ah completion badge) -->
    <circle cx="340" cy="330" r="48" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
    <path d="M 320 330 L 333 343 L 360 316" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
